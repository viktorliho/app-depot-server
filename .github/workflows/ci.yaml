name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install -g npm@11.17.0
      - name: Install pinned Rust and components
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Validate OpenAPI
        run: |
          python3 -m venv "$RUNNER_TEMP/openapi"
          "$RUNNER_TEMP/openapi/bin/pip" install openapi-spec-validator==0.7.2
          "$RUNNER_TEMP/openapi/bin/python" -m openapi_spec_validator docs/openapi.yaml
