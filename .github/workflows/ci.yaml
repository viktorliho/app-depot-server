name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install -g npm@11.17.0
      - name: Install pinned Rust and components
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Prepare public Inno Setup test fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends innoextract libarchive-dev unshield 7zip
          sh crates/server/tests/fixtures/prepare-gog.sh "$RUNNER_TEMP/gog-fixtures"
          printf 'GOG_TEST_FIXTURES=%s\n' "$RUNNER_TEMP/gog-fixtures" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked
      - run: cargo test --locked -p app-depot-server --bin app-depot-server supported_inno_engine -- --ignored
      - run: cargo test --locked -p app-depot-server --test upload_http gog_import_recovers -- --ignored
      - run: npm --prefix web ci
      - run: npm --prefix web run test:unit
      - run: npm --prefix web run build
      - run: target/debug/app-depot-server validate-store store/v2
      - run: STORE_BROWSER=1 python3 store/tests/observed.py target/debug/app-depot-server
      - run: npm --prefix web run smoke:lan-http
        timeout-minutes: 7
      - name: Validate OpenAPI
        run: |
          python3 -m venv "$RUNNER_TEMP/openapi"
          "$RUNNER_TEMP/openapi/bin/pip" install openapi-spec-validator==0.7.2
          "$RUNNER_TEMP/openapi/bin/python" store/validate.py
          "$RUNNER_TEMP/openapi/bin/python" -m openapi_spec_validator docs/openapi.yaml
