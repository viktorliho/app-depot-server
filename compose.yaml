services:
  app-depot:
    build: .
    image: app-depot-server:local
    user: "${APP_DEPOT_UID:-10001}:${APP_DEPOT_GID:-10001}"
    restart: unless-stopped
    ports:
      - "${APP_DEPOT_LISTEN_ADDRESS:-127.0.0.1}:${APP_DEPOT_PORT:-8787}:8787"
    environment:
      APP_DEPOT_DATA_ROOT: /data/production
      APP_DEPOT_ASSETS: /app/web
      APP_DEPOT_BIND: 0.0.0.0:8787
      APP_DEPOT_SESSION_KEY_FILE: /run/secrets/session
      APP_DEPOT_TRUSTED_PROXY_PEERS: "${APP_DEPOT_TRUSTED_PROXY_PEERS:-}"
    volumes:
      - app_depot_data:/data
      - "${APP_DEPOT_SESSION_KEY_FILE:?set APP_DEPOT_SESSION_KEY_FILE}:/run/secrets/session:ro"

volumes:
  app_depot_data:
