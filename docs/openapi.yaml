  /associations/{association_id}/entry-points/validate:
    post:
      operationId: validateAssociationEntryPoints
      tags:
      - Declarations
      summary: Assess entry-point targets and optional portable launches without changing declarations
      description: Target status retains its historical meaning. Separate launch status assesses the optional NativePortableV1 convention using the current Release platforms; it is not local execution readiness or authorization. Declaration PUT remains lossless for arbitrary JSON. This read-only operation creates no revision and does not gate publication.
      parameters:
      - name: association_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: {}
      responses:
        '200':
          description: Target and portable-launch assessment; non-Valid statuses do not modify data.
          content:
            application/json:
              schema:
                type: object
                required: [status, launchStatus, selectionRequiredFor, items]
                properties:
                  status: { type: string, enum: [Absent, Valid, Issues, Unsupported] }
                  launchStatus: { type: string, enum: [Absent, Valid, Issues, Unsupported] }
                  selectionRequiredFor:
                    type: array
                    items: { $ref: '#/components/schemas/NativePlatform' }
                    description: Known platforms on which multiple valid entry points in this association require explicit choice.
                  items:
                    type: array
                    items:
                      type: object
                      required: [index, id, status, launchStatus, launchReason, effectivePlatforms]
                      properties:
                        index: { type: integer, minimum: 0 }
                        id: { type: string }
                        status: { type: string, enum: [Valid, Missing, NotFile, Invalid, Unsupported] }
                        launchStatus: { type: string, enum: [Absent, Valid, Invalid, Unsupported, TargetUnavailable] }
                        launchReason:
                          oneOf:
                          - { type: string, enum: [MalformedLaunch, MalformedMethod, UnknownMethod, TargetNotValid, MissingOrMalformedPlatforms, MalformedReleasePlatforms, NoPlatformIntersection, UnknownPlatform, MalformedArguments, MalformedWorkingDirectory, WorkingDirectoryNotFound] }
                          - { type: 'null' }
                        effectivePlatforms:
                          type: array
                          items: { $ref: '#/components/schemas/NativePlatform' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InvalidRequest' }
      security:
      - {}
      - bearerAuth: []
      - cookieAuth: []
