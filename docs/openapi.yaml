    FinalizationResult:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        phase:
          type: string
          enum:
          - Completed
          - Failed
          - Cancelled
        cancellationReason:
          type: string
          enum:
          - RestoreInvalidated
        artifactId:
          anyOf:
          - $ref: '#/components/schemas/ArtifactId'
          - type: 'null'
        appId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        releaseId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        associationId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        problem:
          anyOf:
          - $ref: '#/components/schemas/Problem'
          - type: 'null'
      required:
      - sessionId
      - operationId
      - phase
      additionalProperties: false
      if:
        properties:
          phase:
            const: Completed
        required:
        - phase
      then:
        properties:
          artifactId:
            $ref: '#/components/schemas/ArtifactId'
          appId:
            type: string
            format: uuid
          releaseId:
            type: string
            format: uuid
          associationId:
            type: string
            format: uuid
        required:
        - artifactId
        - appId
        - releaseId
        - associationId
      else:
        if:
          properties:
            phase:
              const: Failed
          required:
          - phase
        then:
          required:
          - problem
      allOf:
      - if:
          required:
          - cancellationReason
        then:
          properties:
            phase:
              const: Cancelled
          not:
            anyOf:
            - required:
              - artifactId
            - required:
              - appId
            - required:
              - releaseId
            - required:
              - associationId
    Operation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - Finalize
          - CancelUpload
          - DeleteApp
          - DeleteRelease
          - DeleteAssociation
          - Backup
        status:
          type: string
          enum:
          - Accepted
          - Running
          - Completed
          - Failed
        backupId:
          type: string
          format: uuid
        backupOutputAvailable:
          type: boolean
        accessRevoked:
          anyOf:
          - type: boolean
          - type: 'null'
        physicalCleanup:
          anyOf:
          - type: string
            enum:
            - NotStarted
            - Pending
            - Completed
            - RetryableFailure
          - type: 'null'
        result:
          anyOf:
          - $ref: '#/components/schemas/FinalizationResult'
          - type: 'null'
        problem:
          anyOf:
          - $ref: '#/components/schemas/Problem'
          - type: 'null'
      required:
      - id
      - kind
      - status
      additionalProperties: false
      if:
        properties:
          kind:
            enum:
            - DeleteApp
            - DeleteRelease
            - DeleteAssociation
        required:
        - kind
      then:
        properties:
          accessRevoked:
            type: boolean
          physicalCleanup:
            type: string
            enum:
            - NotStarted
            - Pending
            - Completed
            - RetryableFailure
        required:
        - accessRevoked
        - physicalCleanup
      allOf:
      - if:
          properties:
            kind:
              const: Backup
          required:
          - kind
        then:
          required:
          - backupOutputAvailable
          if:
            properties:
              status:
                const: Completed
            required:
            - status
          then:
            required:
            - backupId
          else:
            not:
              required:
              - backupId
            properties:
              backupOutputAvailable:
                const: false
        else:
          allOf:
          - not:
              required:
              - backupId
          - not:
              required:
              - backupOutputAvailable
      - if:
          properties:
            kind:
              const: Backup
            status:
              const: Failed
          required:
          - kind
          - status
        then:
          properties:
            problem:
              $ref: '#/components/schemas/Problem'
          required:
          - problem
      - if:
          properties:
            kind:
              enum:
              - DeleteApp
              - DeleteRelease
          required:
          - kind
        then:
          properties:
            accessRevoked:
              const: true
          required:
          - accessRevoked
