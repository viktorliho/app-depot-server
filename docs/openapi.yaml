      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Missing or inaccessible resource
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Conflicting idempotency key or state
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionFailed:
      description: Stale strong ETag
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PayloadTooLarge:
      description: Artwork exceeds encoded or decoded limits
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: Invalid or unsupported image
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionRequired:
      description: Current binding validator required
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: One revocable personal API token per user.
    cookieAuth:
      type: apiKey
      in: cookie
      name: ad_session
      description: Web UI session. State-changing requests require X-CSRF-Token and Origin validation. HttpOnly and SameSite=Lax always; Secure on HTTPS.
  schemas:
    StoreSnapshot:
      type: object
      required:
      - generation
      - recipes
      properties:
        generation:
          type: integer
        source: {type: string}
        refreshedAt: {type: [integer, 'null']}
        recipes:
          type: array
          items:
            $ref: ../store/v2/schemas/recipe.json
    StoreObservation:
      type: object
      required:
      - id
      - title
      - revision
      - app
      - release
      - status
      - enabled
      - automatic
      - hours
      - lastCheck
      - detected
      - error
      - filesDone
      - filesTotal
      - bytesDone
      - bytesTotal
      properties:
        id:
          type: string
        title:
          type: string
        product: {type: string}
        platform: {type: string}
        currentVersion: {type: [string, 'null']}
        successfulCheck: {type: [integer, 'null']}
        progress:
          type: [object, 'null']
          properties:
            stage: {type: string}
            component: {type: string}
            componentsDone: {type: integer}
            componentsTotal: {type: integer}
            done: {type: integer}
            total: {type: [integer, 'null']}
            bytesPerSecond: {type: [integer, 'null']}
        revision:
          type: integer
        app:
          type:
          - string
          - 'null'
        release:
          type:
          - string
          - 'null'
        status:
          type: string
        enabled:
          type: boolean
        automatic:
          type: boolean
        hours:
          type: integer
        lastCheck:
          type:
          - integer
          - 'null'
        detected:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
        filesDone:
          type: integer
        filesTotal:
          type: integer
        bytesDone:
          type: integer
        bytesTotal:
          type: integer
    SetupStatus:
      type: object
      properties:
        required:
          type: boolean
      required: [required]
      additionalProperties: false
    InitialSetup:
      type: object
      properties:
        token:
          type: string
          minLength: 64
          maxLength: 64
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 16
          maxLength: 1024
      required: [token, username, password]
      additionalProperties: false
    SetupCreated:
      type: object
      properties:
        created:
          const: true
      required: [created]
      additionalProperties: false
    HealthLive:
      type: object
      properties:
        status:
          const: Live
      required:
      - status
      additionalProperties: false
    HealthReady:
      type: object
      properties:
        status:
          const: Ready
      required:
      - status
      additionalProperties: false
    HealthUnavailable:
      type: object
      properties:
        status:
          const: NotReady
      required:
      - status
      additionalProperties: false
    BackupSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        formatVersion:
          type: integer
          const: 1
        capturedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        memberCount:
          type: integer
          minimum: 1
        totalBytes:
          type: integer
          minimum: 0
      required:
      - id
      - formatVersion
      - capturedAt
      - completedAt
      - memberCount
      - totalBytes
      additionalProperties: false
    BackupPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BackupSummary'
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - nextCursor
      additionalProperties: false
    BackupMember:
      type: object
      properties:
        entryId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - SqliteSnapshot
          - CasObject
        relativePath:
          type: string
          pattern: ^(catalog\.sqlite|cas/[0-9a-f]{64})$
          description: Portable path relative to backup root; validated against traversal and collisions.
        size:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
      - entryId
      - kind
      - relativePath
      - size
      - sha256
      additionalProperties: false
      if:
        properties:
          kind:
            const: SqliteSnapshot
        required:
        - kind
      then:
        properties:
          relativePath:
            const: catalog.sqlite
      else:
        properties:
          relativePath:
            pattern: ^cas/[0-9a-f]{64}$
    BackupManifest:
      type: object
      properties:
        formatVersion:
          type: integer
          const: 1
        backupId:
          type: string
          format: uuid
        capturedAt:
          type: string
          format: date-time
        catalogFormatVersion:
          type: integer
          minimum: 1
        members:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BackupMember'
          contains:
            properties:
              kind:
                const: SqliteSnapshot
            required:
            - kind
          minContains: 1
          maxContains: 1
      required:
      - formatVersion
      - backupId
      - capturedAt
      - catalogFormatVersion
      - members
      additionalProperties: false
      description: Same logical manifest as portable manifest.json; metadata and recovery obligations are in the SQLite snapshot.
    AdminDiagnostics:
      type: object
      properties:
        readiness:
          type: string
          enum:
          - Ready
          - NotReady
        recovery:
          type: string
          enum:
          - Idle
          - Running
          - Failed
        migration:
          type: string
          enum:
          - Idle
          - Running
          - Failed
        storagePressure:
          type: string
          enum:
          - Normal
          - Warning
          - Critical
        windowSeconds:
          type: integer
          minimum: 1
        requestFailures:
          type: integer
          minimum: 0
        requestLatencyMsP95:
          type: number
          minimum: 0
        activeUploads:
          type: integer
          minimum: 0
        activeTransfers:
          type: integer
          minimum: 0
        pendingCleanup:
          type: integer
          minimum: 0
        retryableCleanup:
          type: integer
          minimum: 0
        backupsRunning:
          type: integer
          minimum: 0
        backupsFailed:
          type: integer
          minimum: 0
      required:
      - readiness
      - recovery
      - migration
      - storagePressure
      - windowSeconds
      - requestFailures
      - requestLatencyMsP95
      - activeUploads
      - activeTransfers
      - pendingCleanup
      - retryableCleanup
      - backupsRunning
      - backupsFailed
      additionalProperties: false
      description: Redacted aggregates; counters and p95 use current server measurement window.
    JsonData:
      type:
      - object
      - array
      - string
      - number
      - boolean
      - 'null'
      description: Any JSON value, including null; server-managed fields remain outside data. Object values may use the optional appDepot convention described in architecture.md. NativePortableV1 is an optional entry-point method. On Release writes the optional appDepot.installation property is validated as InstallationManifestV1. Neither grants Server execution capability.
    NativePlatform:
      type: string
      enum: [linux/x86_64, linux/x86, linux/aarch64, linux/ppc64le, windows/x86_64, windows/x86, windows/aarch64, macos/x86_64, macos/aarch64]
      description: Exact host OS/architecture token for NativePortableV1. Unknown tokens remain storable but have no v1 match; aliases and case folding are not defined.
    InstallationLocalizationV1:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { const: unknown }
        - type: object
          additionalProperties: false
          required: [mode, language]
          properties:
            mode: { const: fixed }
            language: { type: string, maxLength: 80, pattern: '^[A-Za-z][A-Za-z0-9]{0,7}(-[A-Za-z0-9]{1,8})*$' }
        - type: object
          additionalProperties: false
          required: [mode, languages]
          properties:
            mode: { const: bundled }
            languages:
              type: array
              minItems: 2
              maxItems: 32
              uniqueItems: true
              items: { type: string, maxLength: 80, pattern: '^[A-Za-z][A-Za-z0-9]{0,7}(-[A-Za-z0-9]{1,8})*$' }
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { const: selectable }
    InstallationManifestV1:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, const: 1 }
        recipePayload: { type: boolean, default: false }
        payload:
          type: array
          maxItems: 128
          items: { $ref: '#/components/schemas/InstallationCopyV1' }
        options:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/InstallationOptionV1' }
        localization:
          $ref: '#/components/schemas/InstallationLocalizationV1'
        prerequisites:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/InstallationPrerequisiteV1' }
        unresolved:
          type: array
          maxItems: 128
          items: { type: string, minLength: 1, maxLength: 1024 }
        launch:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [associationId, entryPointId, revisionId, destination]
              properties:
                associationId: { type: string, format: uuid }
                entryPointId: { $ref: '#/components/schemas/InstallationIdentifierV1' }
                revisionId: { type: string, format: uuid }
                destination: { type: string, minLength: 1, maxLength: 1024 }
                workingDirectory: { type: [string, 'null'], maxLength: 1024 }
    InstallationIdentifierV1:
      type: string
      pattern: '^[a-zA-Z0-9_-]{1,80}$'
    InstallationCopyV1:
      type: object
      additionalProperties: false
      required: [associationId, destination]
      properties:
        associationId: { type: string, format: uuid }
        source: { type: string, maxLength: 1024, default: '' }
        destination: { type: string, maxLength: 1024 }
        collision: { type: string, enum: [reject, replaceFile], default: reject }
        platforms:
          type: array
          uniqueItems: true
          maxItems: 6
          items: { $ref: '#/components/schemas/NativePlatform' }
    InstallationOptionV1:
      type: object
      additionalProperties: false
      required: [id, name, choices]
      properties:
        id: { $ref: '#/components/schemas/InstallationIdentifierV1' }
        name: { type: string, minLength: 1, maxLength: 160 }
        language: { type: boolean, default: false }
        multiple: { type: boolean, default: false }
        required: { type: boolean, default: false }
        defaults:
          type: array
          uniqueItems: true
          maxItems: 32
          items: { $ref: '#/components/schemas/InstallationIdentifierV1' }
        choices:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [id, name, payload]
            properties:
              id: { $ref: '#/components/schemas/InstallationIdentifierV1' }
              name: { type: string, minLength: 1, maxLength: 160 }
              payload:
                type: array
                maxItems: 128
                items: { $ref: '#/components/schemas/InstallationCopyV1' }
    InstallationPrerequisiteV1:
      type: object
      additionalProperties: false
      required: [id, name, associationId, platforms, evidence]
      properties:
        id: { $ref: '#/components/schemas/InstallationIdentifierV1' }
        name: { type: string, minLength: 1, maxLength: 160 }
        associationId: { type: string, format: uuid }
        path: { type: string, maxLength: 1024, default: '' }
        platforms:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/NativePlatform' }
        evidence: { type: string, minLength: 1, maxLength: 1024 }
        arguments:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 4096 }
        optional: { type: boolean, default: false }
        successExitCodes:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          default: [0]
          items: { type: integer, format: int32 }
        when:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [optionId, choiceId]
              properties:
                optionId: { $ref: '#/components/schemas/InstallationIdentifierV1' }
                choiceId: { $ref: '#/components/schemas/InstallationIdentifierV1' }
    InstallationPlanV1:
      type: object
      required: [version, appId, releaseId, revisionId, platform, selections, unresolved]
      additionalProperties: false
      oneOf:
        - required: [recipe]
        - required: [files, directories, prerequisites, launch]
      properties:
        version: { type: integer, const: 1 }
        appId: { type: string, format: uuid }
        releaseId: { type: string, format: uuid }
        revisionId: { type: [string, 'null'], format: uuid }
        platform: { $ref: '#/components/schemas/NativePlatform' }
        selections:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/InstallationIdentifierV1' }
        localization:
          $ref: '#/components/schemas/InstallationLocalizationV1'
        unresolved:
          type: array
          items: { type: string }
        files:
          type: object
          additionalProperties: { $ref: '#/components/schemas/RecipeLockedFile' }
        directories:
          type: array
          items: { type: string }
        recipe: { $ref: '#/components/schemas/RecipeLockV1' }
        launch:
          type: [object, 'null']
          required: [method, associationId, entryPointId, revisionId, path, workingDirectory, arguments]
          properties:
            method: { type: string, const: NativePortableV1 }
            associationId: { type: string, format: uuid }
            entryPointId: { $ref: '#/components/schemas/InstallationIdentifierV1' }
            revisionId: { type: string, format: uuid }
            path: { type: string }
            workingDirectory: { type: string }
            arguments:
              type: array
              items: { type: string }
        prerequisites:
          type: array
          items:
            type: object
            required: [id, name, file, path, arguments, optional, evidence, successExitCodes]
            properties:
              id: { $ref: '#/components/schemas/InstallationIdentifierV1' }
              name: { type: string }
              file: { $ref: '#/components/schemas/RecipeLockedFile' }
              path: { type: string }
              arguments:
                type: array
                items: { type: string }
              optional: { type: boolean }
              evidence: { type: string }
              successExitCodes:
                type: array
                items: { type: integer, format: int32 }
    NativePortableLaunchV1:
      type: object
      description: Optional value of one Association data.appDepot.entryPoints[].launch. Its target is the enclosing entry point; it never supplies another path or changes Artifact identity. Additional properties are inert under v1.
      required: [method]
      properties:
        method: { type: string, const: NativePortableV1 }
        workingDirectory:
          type: string
          description: Exact Artifact-relative Tree directory path; empty string denotes Artifact root. Omission uses the target file's parent directory. Only empty or omitted is valid for File Artifacts.
        arguments:
          type: array
          maxItems: 64
          description: Literal UTF-8 argv values, no shell or substitutions. Each string is at most 4096 UTF-8 bytes; total at most 16384 bytes. Empty values are allowed, control characters are not.
          items: { type: string }
    Artwork:
      type: object
      properties:
        appId: { type: string, format: uuid }
        role: { type: string, minLength: 1, maxLength: 80 }
        id: { type: string, format: uuid }
        digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        mimeType: { type: string, enum: [image/png, image/jpeg, image/webp] }
        size: { type: integer, minimum: 1, maximum: 8388608 }
        width: { type: integer, minimum: 1, maximum: 8192 }
        height: { type: integer, minimum: 1, maximum: 8192 }
        etag: { type: string }
      required: [appId, role, id, digest, mimeType, size, width, height, etag]
      additionalProperties: false
    AppKind:
      type: string
      enum: [standard, derived]
    RecipePlatform:
      type: string
      enum: [linux/x86_64, linux/x86, linux/aarch64, linux/ppc64le, windows/x86_64, windows/x86, windows/aarch64, macos/x86_64, macos/aarch64]
    RecipeV1:
      type: object
      required: [version, dependencies, targets]
      additionalProperties: false
      properties:
        version: { type: integer, const: 1 }
        dependencies:
          type: object
          minProperties: 1
          maxProperties: 32
          propertyNames: { pattern: '^[A-Za-z0-9_-]{1,64}$' }
          additionalProperties:
            $ref: '#/components/schemas/RecipeDependency'
        targets:
          type: object
          minProperties: 1
          maxProperties: 6
          propertyNames:
            $ref: '#/components/schemas/RecipePlatform'
          additionalProperties:
            $ref: '#/components/schemas/RecipeTarget'
    RecipeDependency:
      type: object
      required: [appId, selector]
      additionalProperties: false
      properties:
        appId: { type: string, format: uuid }
        selector:
          oneOf:
          - type: object
            required: [type]
            additionalProperties: false
            properties:
              type: { const: latest }
          - type: object
            required: [type, releaseId]
            additionalProperties: false
            properties:
              type: { const: release }
              releaseId: { type: string, format: uuid }
          - type: object
            required: [type, name]
            additionalProperties: false
            properties:
              type: { const: channel }
              name: { type: string, minLength: 1, maxLength: 255 }
        platforms:
          type: [array, 'null']
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RecipePlatform'
    RecipeTarget:
      type: object
      required: [operations, launch]
      additionalProperties: false
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/RecipeCopy'
        launch:
          $ref: '#/components/schemas/RecipeLaunch'
    RecipeCopy:
      type: object
      required: [dependency, destination]
      additionalProperties: false
      properties:
        dependency: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        associationId: { type: [string, 'null'], format: uuid }
        associationLabel: { type: [string, 'null'], minLength: 1, maxLength: 160 }
        source:
          $ref: '#/components/schemas/RecipeRelativePath'
          default: ''
        destination:
          $ref: '#/components/schemas/RecipeRelativePath'
        executable: { type: boolean, default: false }
        collision: { type: string, enum: [reject, replaceFile], default: reject }
      not:
        required: [associationId, associationLabel]
        properties:
          associationId: { type: string }
          associationLabel: { type: string }
    RecipeRelativePath:
      type: string
      maxLength: 1024
      description: Portable recipe path. See recipe-v1.md for byte limits, segments, and fields where the empty string is allowed.
    RecipeLaunch:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          $ref: '#/components/schemas/RecipeRelativePath'
          minLength: 1
        workingDirectory:
          $ref: '#/components/schemas/RecipeRelativePath'
          default: ''
        arguments:
          type: array
          maxItems: 64
          default: []
          items: { type: string, maxLength: 4096 }
    RecipeLayout:
      type: object
      required: [files, directories, launchCandidates]
      additionalProperties: false
      properties:
        launchCandidates:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/RecipeRelativePath', minLength: 1 }
        files:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/RecipeRelativePath', minLength: 1 }
        directories:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/RecipeRelativePath', minLength: 1 }
    RecipeLockV1:
      type: object
      required: [version, appId, releaseId, platform, releases, files, directories, launch]
      additionalProperties: false
      properties:
        version: { type: integer, const: 1 }
        appId: { type: string, format: uuid }
        releaseId: { type: string, format: uuid }
        platform:
          $ref: '#/components/schemas/RecipePlatform'
        releases:
          type: object
          propertyNames: { format: uuid }
          additionalProperties:
            $ref: '#/components/schemas/RecipeLockedRelease'
        files:
          type: object
          propertyNames: { $ref: '#/components/schemas/RecipeRelativePath', minLength: 1 }
          additionalProperties:
            $ref: '#/components/schemas/RecipeLockedFile'
        directories:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/RecipeRelativePath', minLength: 1 }
        launch:
          $ref: '#/components/schemas/RecipeLaunch'
    RecipeLockedRelease:
      type: object
      required: [appId, version, dependencies, artifacts]
      additionalProperties: false
      properties:
        appId: { type: string, format: uuid }
        version: { type: [string, 'null'] }
        dependencies:
          type: object
          additionalProperties: { type: string, format: uuid }
        artifacts:
          type: object
          propertyNames: { format: uuid }
          additionalProperties:
            type: string
            pattern: '^(adfile:sha256:|adtree:v1:sha256:)[0-9a-f]{64}$'
    RecipeLockedFile:
      type: object
      required: [associationId, artifactId, fileId, sha256, size, executable]
      additionalProperties: false
      properties:
        associationId: { type: string, format: uuid }
        artifactId:
          type: string
          pattern: '^(adfile:sha256:|adtree:v1:sha256:)[0-9a-f]{64}$'
        fileId: { type: [string, 'null'], format: uuid }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, minimum: 0 }
        executable: { type: boolean }
    App:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        ownerId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/AppKind'
        visibility:
          type: string
          enum:
          - Private
          - Public
        state:
          type: string
          enum:
          - Draft
          - Published
      required:
      - id
      - name
      - slug
      - ownerId
      - kind
      - visibility
      - state
      additionalProperties: false
    AppCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/AppKind'
          default: standard
      required:
      - name
      additionalProperties: false
    AppPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        visibility:
          type: string
          enum:
          - Private
          - Public
      required: []
      additionalProperties: false
    Release:
      type: object
      properties:
        buildPlatform: { $ref: '#/components/schemas/RecipePlatform' }
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - Draft
          - Published
        version:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - appId
      - state
      additionalProperties: false
    ReleaseCreate:
      type: object
      properties:
        buildPlatform: { $ref: '#/components/schemas/RecipePlatform' }
        version:
          anyOf:
          - type: string
          - type: 'null'
      required: []
      additionalProperties: false
    ReleasePatch:
      type: object
      properties:
        version:
          anyOf:
          - type: string
          - type: 'null'
      required: []
      additionalProperties: false
    Artifact:
      type: object
      properties:
        id:
          type: string
          pattern: ^(adfile:sha256:[0-9a-f]{64}|adtree:v1:sha256:[0-9a-f]{64})$
        kind:
          type: string
          enum:
          - File
          - Tree
        size:
          anyOf:
