  /apps/{app_id}/artwork:
    get:
      operationId: listAppArtwork
      tags: [Artwork]
      summary: List current App artwork bindings, ordered by role
      parameters:
      - name: app_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current artwork for an accessible App
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Artwork' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /apps/{app_id}/artwork/{role}:
    parameters:
    - name: app_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    - name: role
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 80 }
    get:
      operationId: getAppArtwork
      tags: [Artwork]
      summary: Read a current artwork binding
      description: Reading steam.logo uses the explicit legacy binding when present, otherwise resolves canonical logo. The metadata role identifies the actual binding.
      responses:
        '200':
          description: Current artwork metadata
          headers:
            ETag:
              schema: { type: string }
              description: Strong current binding validator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artwork' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putAppArtwork
      tags: [Artwork]
      summary: Create or replace one current artwork binding
      description: Creation requires If-None-Match star; replacement requires the current strong If-Match. Bytes are sniffed and fully decoded. ICO is accepted for icon only and normalized to RGBA PNG before CAS registration. Writes always target the explicit role. Exactly one precondition header is required.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
      - name: If-Match
        in: header
        schema: { type: string }
      - name: If-None-Match
        in: header
        schema: { type: string }
      - name: X-CSRF-Token
        in: header
        schema: { type: string }
        description: Required for cookie-authenticated mutations.
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          image/x-icon:
            schema: { type: string, format: binary }
          image/vnd.microsoft.icon:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Binding created, replaced, or exact idempotent replay
          headers:
            ETag:
              schema: { type: string }
              description: Strong current binding validator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artwork' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      operationId: deleteAppArtwork
      tags: [Artwork]
      summary: Remove one current artwork binding
      parameters:
      - name: If-Match
        in: header
        required: true
        schema: { type: string }
      - name: X-CSRF-Token
        in: header
        schema: { type: string }
      responses:
        '204': { description: Binding removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /apps/{app_id}/artwork/{role}/content:
