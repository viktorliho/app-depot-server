        phase:
          type: string
          enum:
          - Receiving
          - Verifying
          - Importing
          - Committing
          - Completed
          - Failed
          - Cancelled
        cancellationReason:
          type: string
          enum:
          - RestoreInvalidated
        inventoryComplete:
          type: boolean
