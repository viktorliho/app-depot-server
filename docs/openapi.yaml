components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: One revocable personal API token per user.
    cookieAuth:
      type: apiKey
      in: cookie
      name: ad_session
      description: Web UI session. State-changing requests require X-CSRF-Token and Origin validation. HttpOnly and SameSite=Lax always; Secure on HTTPS.
  schemas:
    SetupStatus:
      type: object
      properties:
        required:
          type: boolean
      required: [required]
      additionalProperties: false
    InitialSetup:
      type: object
      properties:
        token:
          type: string
          minLength: 64
          maxLength: 64
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 16
          maxLength: 1024
      required: [token, username, password]
      additionalProperties: false
    SetupCreated:
      type: object
      properties:
        created:
          const: true
      required: [created]
      additionalProperties: false
    HealthLive:
      type: object
      properties:
        status:
          const: Live
      required:
      - status
      additionalProperties: false
    HealthReady:
      type: object
      properties:
        status:
          const: Ready
      required:
      - status
      additionalProperties: false
    HealthUnavailable:
      type: object
      properties:
        status:
          const: NotReady
      required:
      - status
      additionalProperties: false
    BackupSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        formatVersion:
          type: integer
          const: 1
        capturedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        memberCount:
          type: integer
          minimum: 1
        totalBytes:
          type: integer
          minimum: 0
      required:
      - id
      - formatVersion
      - capturedAt
      - completedAt
      - memberCount
      - totalBytes
      additionalProperties: false
    BackupPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BackupSummary'
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - nextCursor
      additionalProperties: false
    BackupMember:
      type: object
      properties:
        entryId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - SqliteSnapshot
          - CasObject
        relativePath:
          type: string
          pattern: ^(catalog\.sqlite|cas/[0-9a-f]{64})$
          description: Portable path relative to backup root; validated against traversal and collisions.
        size:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
      - entryId
      - kind
      - relativePath
      - size
      - sha256
      additionalProperties: false
      if:
        properties:
          kind:
            const: SqliteSnapshot
        required:
        - kind
      then:
        properties:
          relativePath:
            const: catalog.sqlite
      else:
        properties:
          relativePath:
            pattern: ^cas/[0-9a-f]{64}$
    BackupManifest:
      type: object
      properties:
        formatVersion:
          type: integer
          const: 1
        backupId:
          type: string
          format: uuid
        capturedAt:
          type: string
          format: date-time
        catalogFormatVersion:
          type: integer
          minimum: 1
        members:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BackupMember'
          contains:
            properties:
              kind:
                const: SqliteSnapshot
            required:
            - kind
          minContains: 1
          maxContains: 1
      required:
      - formatVersion
      - backupId
      - capturedAt
      - catalogFormatVersion
      - members
      additionalProperties: false
      description: Same logical manifest as portable manifest.json; metadata and recovery obligations are in the SQLite snapshot.
    AdminDiagnostics:
      type: object
      properties:
        readiness:
          type: string
          enum:
          - Ready
          - NotReady
        recovery:
          type: string
          enum:
          - Idle
          - Running
          - Failed
        migration:
          type: string
          enum:
          - Idle
          - Running
          - Failed
        storagePressure:
          type: string
          enum:
          - Normal
          - Warning
          - Critical
        windowSeconds:
          type: integer
          minimum: 1
        requestFailures:
          type: integer
          minimum: 0
        requestLatencyMsP95:
          type: number
          minimum: 0
        activeUploads:
          type: integer
          minimum: 0
        activeTransfers:
          type: integer
          minimum: 0
        pendingCleanup:
          type: integer
          minimum: 0
        retryableCleanup:
          type: integer
          minimum: 0
        backupsRunning:
          type: integer
          minimum: 0
        backupsFailed:
          type: integer
          minimum: 0
      required:
      - readiness
      - recovery
      - migration
      - storagePressure
      - windowSeconds
      - requestFailures
      - requestLatencyMsP95
      - activeUploads
      - activeTransfers
      - pendingCleanup
      - retryableCleanup
      - backupsRunning
      - backupsFailed
      additionalProperties: false
      description: Redacted aggregates; counters and p95 use current server measurement window.
    JsonData:
      type:
      - object
      - array
      - string
      - number
      - boolean
      - 'null'
      description: Any JSON value, including null; server-managed fields remain outside data.
    App:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        ownerId:
          type: string
          format: uuid
        visibility:
          type: string
          enum:
          - Private
          - Public
        state:
          type: string
          enum:
          - Draft
          - Published
      required:
      - id
      - name
      - slug
      - ownerId
      - visibility
      - state
      additionalProperties: false
    AppCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required:
      - name
      additionalProperties: false
    AppPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        visibility:
          type: string
          enum:
          - Private
          - Public
      required: []
      additionalProperties: false
    Release:
      type: object
      properties:
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - Draft
          - Published
        version:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - appId
      - state
      additionalProperties: false
    ReleaseCreate:
      type: object
      properties:
        version:
          anyOf:
          - type: string
          - type: 'null'
      required: []
      additionalProperties: false
    ReleasePatch:
      type: object
      properties:
        version:
          anyOf:
          - type: string
          - type: 'null'
      required: []
      additionalProperties: false
    Artifact:
      type: object
      properties:
        id:
          type: string
          pattern: ^(adfile:sha256:[0-9a-f]{64}|adtree:v1:sha256:[0-9a-f]{64})$
        kind:
          type: string
          enum:
          - File
          - Tree
        size:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 18446744073709551615
          - type: 'null'
      required:
      - id
      - kind
      additionalProperties: false
      if:
        properties:
          kind:
            const: File
        required:
        - kind
      then:
        properties:
          id:
            type: string
            pattern: ^adfile:sha256:[0-9a-f]{64}$
          size:
            type: integer
            minimum: 0
            maximum: 18446744073709551615
        required:
        - size
      else:
        properties:
          id:
            type: string
            pattern: ^adtree:v1:sha256:[0-9a-f]{64}$
    Association:
      type: object
      properties:
        id:
          type: string
          format: uuid
        releaseId:
          type: string
          format: uuid
        artifactId:
          $ref: '#/components/schemas/ArtifactId'
      required:
      - id
      - releaseId
      - artifactId
      additionalProperties: false
    AssociationCreate:
      type: object
      properties:
        artifactId:
          $ref: '#/components/schemas/ArtifactId'
      required:
      - artifactId
      additionalProperties: false
    ArtifactId:
      type: string
      pattern: ^(adfile:sha256:[0-9a-f]{64}|adtree:v1:sha256:[0-9a-f]{64})$
    Channel:
      type: object
      properties:
        appId:
          type: string
          format: uuid
        name:
          type: string
          pattern: ^[^/]+$
        releaseId:
          type: string
          format: uuid
      required:
      - appId
      - name
      - releaseId
      additionalProperties: false
    ChannelPut:
      type: object
      properties:
        releaseId:
          type: string
          format: uuid
      required:
      - releaseId
      additionalProperties: false
    ChannelMove:
      type: object
      properties:
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        name:
          type: string
        releaseId:
          type: string
          format: uuid
        movedAt:
          type: string
          format: date-time
      required:
      - id
      - appId
      - name
      - releaseId
      - movedAt
      additionalProperties: false
    DeclarationDocument:
