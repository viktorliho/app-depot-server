  /server-imports:
    post:
      operationId: importFromServerStorage
      tags: [Uploads]
      summary: Import approved Server-side content through the existing upload and CAS pipeline
      description: >-
        The response is a stream of SSE data frames containing ServerImportProgress JSON.
        Scanning is indeterminate. Receiving reports authoritative staged bytes by file or
        range; Verifying, Importing (ZIP) and Committing have no fabricated percentage.
        An exact retry uses the same key and request; after interruption, retry rechecks
        the source and resumes only authoritative upload ranges. Registration creates a
        Draft Release and never publishes automatically. Source bytes are never modified.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
      - name: X-CSRF-Token
        in: header
        schema: { type: string }
        description: Required for cookie-authenticated requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerImportRequest'
      responses:
        '200':
          description: SSE progress stream ending in Completed or Failed.
          content:
            text/event-stream:
              schema:
                type: string
                description: Each data frame is ServerImportProgress JSON.
        default:
          description: RFC 9457 Problem Details for rejected requests before stream creation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
    delete:
      operationId: cancelServerImport
      tags: [Uploads]
      summary: Cancel an active Server import by its request key
      description: Cancellation before session creation stops scanning; after creation it uses the existing upload cancellation operation. A completed registration cannot be undone.
      parameters:
      - name: X-CSRF-Token
        in: header
        schema: { type: string }
        description: Required for cookie-authenticated requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestKey: { type: string, minLength: 1, maxLength: 255 }
              required: [requestKey]
              additionalProperties: false
      responses:
        '200':
          description: Completed registration won the cancellation race.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationResult'
        '202':
          description: Cancellation accepted; use the existing upload operation if a session was created.
          content:
            application/json:
              schema:
                type: object
        default:
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
