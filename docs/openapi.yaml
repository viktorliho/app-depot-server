              - backupId
          - not:
              required:
              - backupOutputAvailable
      - if:
          properties:
            kind:
              const: Backup
            status:
              const: Failed
          required:
          - kind
          - status
        then:
          properties:
            problem:
              $ref: '#/components/schemas/Problem'
          required:
          - problem
      - if:
          properties:
            kind:
              enum:
              - DeleteApp
              - DeleteRelease
          required:
          - kind
        then:
          properties:
            accessRevoked:
              const: true
          required:
          - accessRevoked
