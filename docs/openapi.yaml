        properties:
          mode:
            enum:
            - BareFile
            - ZipImport
        required:
        - mode
      then:
        required:
        - file
        properties:
          file:
            allOf:
            - $ref: '#/components/schemas/UploadEntry'
            - properties:
                type:
                  const: File
              required:
              - type
      allOf:
      - if:
          required:
          - cancellationReason
        then:
          properties:
            phase:
              const: Cancelled
    Interval:
