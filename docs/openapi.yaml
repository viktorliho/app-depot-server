openapi: 3.1.0
info:
  title: App Depot Server API
  version: 1.0.0
  description: 'Normative HTTP API v1. Semantics: api.md. Store acquisition and enabled automatic updates request explicit Release publication after validation.'
servers:
- url: /api/v1
security:
- bearerAuth: []
- cookieAuth: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags:
      - Operations
      summary: Minimal process liveness without private data
      responses:
        '200':
          description: Responsive process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
      security:
      - {}
      - bearerAuth: []
      - cookieAuth: []
  /health/ready:
    get:
      operationId: getReadiness
      tags:
      - Operations
      summary: Mandatory recovery and storage readiness
      responses:
        '200':
          description: Safe to serve requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
        '503':
          description: Not ready; no private details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
      security:
      - {}
      - bearerAuth: []
      - cookieAuth: []
  /backups:
    post:
      operationId: startBackup
      tags:
      - Operations
      summary: Start Server Admin online backup; no request body
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Bound to Admin principal and backup operation; exact retry returns the same operation.
      - name: X-CSRF-Token
        in: header
        schema:
          type: string
        description: Required for cookie-authenticated state changes.
      responses:
        '202':
          description: Backup operation or exact idempotent replay; status may be terminal and output availability is separate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
            Location:
              description: Operation resource URL.
              schema:
                type: string
                pattern: ^/api/v1/operations/[0-9a-f-]+$
        '400':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '507':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
    get:
      operationId: listBackups
      tags:
      - Operations
      summary: List completed managed backups for Server Admin
      parameters:
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Only Completed backups with independently verified available output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupPage'
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
        '400':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /backups/{backup_id}:
    get:
      operationId: getBackupManifest
      tags:
      - Operations
      summary: Read completed portable backup manifest as Server Admin
      parameters:
      - name: backup_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Versioned portable manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupManifest'
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
        '401':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown or unavailable backup output; RFC 9457 not_found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /backups/{backup_id}/entries/{entry_id}:
    get:
      operationId: getBackupEntry
      tags:
      - Operations
      summary: Download immutable backup member by opaque ID as Server Admin
      parameters:
      - name: backup_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Range
        in: header
        schema:
          type: string
        description: RFC 9110 single byte range; multiple ranges may be ignored with 200.
      - name: If-Range
        in: header
        schema:
          type: string
        description: Strong ETag; mismatch returns full 200.
      responses:
        '200':
          description: Complete immutable member
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
            ETag:
              description: Strong validator of immutable member bytes.
              schema:
                type: string
            Accept-Ranges:
              description: Supported byte ranges.
              schema:
                type: string
                const: bytes
        '206':
          description: Single byte range
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
            ETag:
              description: Strong validator of immutable member bytes.
              schema:
                type: string
            Accept-Ranges:
              description: Supported byte ranges.
              schema:
                type: string
                const: bytes
            Content-Range:
              description: Returned inclusive byte range and total size.
              schema:
                type: string
        '401':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown or unavailable backup output; RFC 9457 not_found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '416':
          description: RFC 9457 range_not_satisfiable Problem Details for an unsatisfiable byte range.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
            Content-Range:
              description: 'Unsatisfied RFC 9110 range: bytes */complete-length.'
              required: true
              schema:
                type: string
                pattern: ^bytes \*/[0-9]+$
        '503':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /admin/store/activity:
    get:
      operationId: listStoreActivity
      tags:
      - Store
      summary: List recent completed Store checks and acquisitions for a Server Admin
      responses:
        '200':
          description: List recent completed Store checks and acquisitions for a Server
            Admin
          content:
            application/json:
              schema: &id001
                type: array
                items: &id002
                  type: object
  /admin/metadata-providers:
    get:
      operationId: metadataProviderSettings
      tags:
      - Metadata
      summary: Read administrator provider settings and key presence
      responses:
        '200':
          description: Read administrator provider settings and key presence
          content:
            application/json:
              schema:
                type: object
                properties:
                  steam:
                    type: boolean
                  steamGridDb:
                    type: boolean
                  hasKey:
                    type: boolean
    put:
      operationId: configureMetadataProviders
      tags:
      - Metadata
      summary: Update administrator provider configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                steam:
                  type: boolean
                steamGridDb:
                  type: boolean
                key:
                  type: string
                  writeOnly: true
      responses:
        '204':
          description: Update administrator provider configuration
  /admin/metadata-providers/test:
    post:
      operationId: testMetadataProviders
      tags:
      - Metadata
      summary: Verify configured metadata providers
      responses:
        '204':
          description: Verify configured metadata providers
  /metadata/steam/search:
    get:
      operationId: searchMetadata
      tags:
      - Metadata
      summary: Search providers and catalog identities
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Search providers and catalog identities
          content:
            application/json:
              schema: *id001
  /metadata/steam/{id}:
    get:
      operationId: previewMetadata
      tags:
      - Metadata
      summary: Preview descriptive fields for an explicit Steam identity
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Preview descriptive fields for an explicit Steam identity
          content:
            application/json:
              schema: *id002
  /metadata/steam/{id}/candidates/{role}:
    get:
      operationId: browseArtworkCandidates
      tags:
      - Metadata
      summary: List optional artwork provider candidates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: role
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List optional artwork provider candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
  /metadata/steam/{id}/artwork/{role}:
    get:
      operationId: previewExternalArtwork
      tags:
      - Metadata
      summary: Read a validated artwork preview from the Server
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: role
        in: path
        required: true
        schema:
          type: string
      - name: asset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Read a validated artwork preview from the Server
          content:
            image/*:
              schema:
                type: string
                format: binary
  /apps/{app_id}/metadata/apply:
    post:
      operationId: applyProviderMetadata
      tags:
      - Metadata
      summary: Apply selected metadata fields and artwork to a manageable App
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - fields
              - artwork
              properties:
                id:
                  type: integer
                fields:
                  type: array
                  items:
                    type: string
                artwork:
                  type: array
                  items:
                    type: string
                assets:
                  type: object
                  additionalProperties:
                    type: integer
      responses:
        '204':
          description: Apply selected metadata fields and artwork to a manageable App
  /admin/store:
    get:
      summary: Browse the accepted Store catalog
      description: Requires Server Admin permission.
      responses:
        '200':
          description: Browse the accepted Store catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSnapshot'
        '403':
          description: Server Admin permission required
      operationId: getStoreCatalog
      tags:
      - Store
  /admin/store/refresh:
    post:
      summary: Refresh the trusted Store catalog
      description: Requires Server Admin permission.
      responses:
        '200':
          description: Refresh the trusted Store catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSnapshot'
        '403':
          description: Server Admin permission required
      operationId: refreshStoreCatalog
      tags:
      - Store
  /admin/store/observations:
    get:
      summary: List observed applications and job status
      description: Requires Server Admin permission.
      responses:
        '200':
          description: List observed applications and job status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreObservation'
        '403':
          description: Server Admin permission required
      operationId: listStoreObservations
      tags:
      - Store
  /admin/store/{id}/add:
    post:
      summary: Acquire a Store application
      description: Requires Server Admin permission.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platforms]
              properties:
                platforms:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string}
      responses:
        '202':
          description: Acquire a Store application
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
        '403':
          description: Server Admin permission required
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      operationId: addStoreApplication
      tags:
      - Store
  /admin/store/{id}/adopt:
    post:
      summary: Adopt the latest catalog recipe revision
      description: Requires Server Admin permission.
      responses:
        '202':
          description: Adopt the latest catalog recipe revision
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
        '403':
          description: Server Admin permission required
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      operationId: adoptStoreRecipe
      tags:
      - Store
  /admin/store/{id}/check:
    post:
      summary: Queue an upstream component check
      description: Requires Server Admin permission.
      responses:
        '202':
          description: Queue an upstream component check
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
        '403':
          description: Server Admin permission required
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      operationId: checkStoreUpdates
      tags:
      - Store
  /admin/store/{id}/update:
    post:
      summary: Apply a detected upstream update once
      description: Requires Server Admin permission.
      responses:
        '202':
          description: Apply a detected upstream update once
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
        '403':
          description: Server Admin permission required
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      operationId: applyStoreUpdate
      tags:
      - Store
  /admin/store/{id}/observation:
    put:
      summary: Configure upstream observation
      description: Requires Server Admin permission.
      responses:
        '204':
          description: Configure upstream observation
        '403':
          description: Server Admin permission required
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - hours
              - automatic
              - enabled
              additionalProperties: false
              properties:
                hours:
                  type: integer
                  minimum: 1
                  maximum: 8760
                enabled:
                  type: boolean
                automatic:
                  type: boolean
      operationId: configureStoreObservation
      tags:
      - Store
  /admin/diagnostics:
    get:
      operationId: getAdminDiagnostics
      tags:
      - Operations
      summary: Redacted operational diagnostics for Server Admin
      responses:
        '200':
          description: Aggregates only; no secrets or private content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDiagnostics'
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
        '401':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /capabilities:
    get:
      operationId: getCapabilities
      tags:
      - Capabilities
      summary: Actual supported protocol capabilities
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '500':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - {}
      - bearerAuth: []
      - cookieAuth: []
  /setup:
    get:
      operationId: getInitialSetupStatus
      tags: [Authentication]
      summary: Report whether initial Admin setup is required
      security: []
      responses:
        '200':
          description: Setup status without a token or account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
    post:
      operationId: completeInitialSetup
      tags: [Authentication]
      summary: Create the first Admin with the startup-log setup token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialSetup'
      responses:
        '201':
          description: First Admin created; setup token invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupCreated'
        '403':
          description: Invalid token, forbidden origin, rate limit, or setup already completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/sessions:
    post:
      operationId: createBrowserSession
      tags:
      - Authentication
      summary: Create Web UI session
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly SameSite=Lax session cookie; Secure when the effective origin is HTTPS.
        '400':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
  /auth/sessions/current:
    get:
      operationId: getBrowserSession
      tags:
      - Authentication
      summary: Read current browser session and CSRF token
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
    delete:
      operationId: logoutBrowserSession
      tags:
      - Authentication
      summary: Invalidate browser session
      parameters:
      - name: X-CSRF-Token
        in: header
        schema:
          type: string
        description: Required for cookie-authenticated state-changing requests; not required for Bearer.
      responses:
        '204':
          description: '204'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
  /me/token:
    get:
      operationId: getMyTokenMetadata
      tags:
      - Users
      summary: Read personal token metadata, never secret
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenMetadata'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
    put:
      operationId: replaceMyToken
      tags:
      - Users
      summary: Issue or replace one personal token; reveal secret once
      parameters:
      - name: X-CSRF-Token
        in: header
        schema:
          type: string
        description: Required for cookie-authenticated state-changing requests; not required for Bearer.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenIssue'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      security:
      - bearerAuth: []
      - cookieAuth: []
    delete:
      operationId: revokeMyToken
      tags:
      - Users
      summary: Revoke personal token
      parameters:
      - name: X-CSRF-Token
        in: header
        schema:
          type: string
        description: Required for cookie-authenticated state-changing requests; not required for Bearer.
