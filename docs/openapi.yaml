openapi: 3.1.0
info:
  title: App Depot Server API
  version: 1.0.0
  description: 'Normative HTTP API v1. Semantics: api.md. No operation implies publication except
    explicit publish.'
servers:
- url: /api/v1
security:
- bearerAuth: []
- cookieAuth: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags:
      - Operations
      summary: Minimal process liveness without private data
      responses:
        '200':
          description: Responsive process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
      security:
      - {}
      - bearerAuth: []
      - cookieAuth: []
  /health/ready:
    get:
      operationId: getReadiness
      tags:
      - Operations
      summary: Mandatory recovery and storage readiness
      responses:
        '200':
          description: Safe to serve requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
        '503':
          description: Not ready; no private details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
      security:
      - {}
      - bearerAuth: []
      - cookieAuth: []
  /backups:
    post:
      operationId: startBackup
      tags:
      - Operations
      summary: Start Server Admin online backup; no request body
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Bound to Admin principal and backup operation; exact retry returns the same operation.
      - name: X-CSRF-Token
        in: header
        schema:
          type: string
        description: Required for cookie-authenticated state changes.
      responses:
        '202':
          description: Backup operation or exact idempotent replay; status may be terminal and output availability is separate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
            Location:
              description: Operation resource URL.
              schema:
                type: string
                pattern: ^/api/v1/operations/[0-9a-f-]+$
        '400':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '507':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
    get:
      operationId: listBackups
      tags:
      - Operations
      summary: List completed managed backups for Server Admin
      parameters:
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Only Completed backups with independently verified available output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupPage'
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
        '400':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /backups/{backup_id}:
    get:
      operationId: getBackupManifest
      tags:
      - Operations
      summary: Read completed portable backup manifest as Server Admin
      parameters:
      - name: backup_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Versioned portable manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupManifest'
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
        '401':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown or unavailable backup output; RFC 9457 not_found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /backups/{backup_id}/entries/{entry_id}:
    get:
      operationId: getBackupEntry
      tags:
      - Operations
      summary: Download immutable backup member by opaque ID as Server Admin
      parameters:
      - name: backup_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Range
        in: header
        schema:
          type: string
        description: RFC 9110 single byte range; multiple ranges may be ignored with 200.
      - name: If-Range
        in: header
        schema:
          type: string
        description: Strong ETag; mismatch returns full 200.
      responses:
        '200':
          description: Complete immutable member
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
            ETag:
              description: Strong validator of immutable member bytes.
              schema:
                type: string
            Accept-Ranges:
              description: Supported byte ranges.
              schema:
                type: string
                const: bytes
        '206':
          description: Single byte range
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
            ETag:
              description: Strong validator of immutable member bytes.
              schema:
                type: string
            Accept-Ranges:
              description: Supported byte ranges.
              schema:
                type: string
                const: bytes
            Content-Range:
              description: Returned inclusive byte range and total size.
              schema:
                type: string
        '401':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown or unavailable backup output; RFC 9457 not_found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '416':
          description: RFC 9457 range_not_satisfiable Problem Details for an unsatisfiable byte range.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
            Content-Range:
              description: 'Unsatisfied RFC 9110 range: bytes */complete-length.'
              required: true
              schema:
                type: string
                pattern: ^bytes \*/[0-9]+$
        '503':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /admin/diagnostics:
    get:
      operationId: getAdminDiagnostics
      tags:
      - Operations
      summary: Redacted operational diagnostics for Server Admin
      responses:
        '200':
          description: Aggregates only; no secrets or private content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDiagnostics'
          headers:
            Cache-Control:
              description: Sensitive response must not be stored.
              schema:
                type: string
                const: no-store
        '401':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: RFC 9457 Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /capabilities:
    get:
      operationId: getCapabilities
      tags:
      - Capabilities
      summary: Actual supported protocol capabilities
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '500':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - {}
      - bearerAuth: []
      - cookieAuth: []
  /setup:
    get:
      operationId: getInitialSetupStatus
      tags: [Authentication]
      summary: Report whether initial Admin setup is required
      security: []
      responses:
        '200':
          description: Setup status without a token or account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
    post:
      operationId: completeInitialSetup
      tags: [Authentication]
      summary: Create the first Admin with the startup-log setup token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialSetup'
      responses:
        '201':
          description: First Admin created; setup token invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupCreated'
        '403':
          description: Invalid token, forbidden origin, rate limit, or setup already completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/sessions:
    post:
      operationId: createBrowserSession
      tags:
      - Authentication
      summary: Create Web UI session
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly SameSite=Lax session cookie; Secure when the effective origin is HTTPS.
        '400':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
  /auth/sessions/current:
    get:
      operationId: getBrowserSession
      tags:
      - Authentication
      summary: Read current browser session and CSRF token
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
    delete:
      operationId: logoutBrowserSession
      tags:
      - Authentication
      summary: Invalidate browser session
      parameters:
      - name: X-CSRF-Token
        in: header
        schema:
          type: string
        description: Required for cookie-authenticated state-changing requests; not required for Bearer.
      responses:
        '204':
          description: '204'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - cookieAuth: []
  /me/token:
    get:
      operationId: getMyTokenMetadata
      tags:
      - Users
      summary: Read personal token metadata, never secret
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenMetadata'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
    put:
      operationId: replaceMyToken
      tags:
      - Users
      summary: Issue or replace one personal token; reveal secret once
      parameters:
      - name: X-CSRF-Token
        in: header
        schema:
          type: string
        description: Required for cookie-authenticated state-changing requests; not required for Bearer.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenIssue'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      security:
      - bearerAuth: []
      - cookieAuth: []
    delete:
      operationId: revokeMyToken
      tags:
      - Users
      summary: Revoke personal token
      parameters:
      - name: X-CSRF-Token
        in: header
        schema:
          type: string
        description: Required for cookie-authenticated state-changing requests; not required for Bearer.
      responses:
        '204':
          description: '204'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /users:
    get:
      operationId: listUsers
      tags:
      - Users
      summary: 'Admin: list users'
      parameters:
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
        description: Default 100; actual maximum in capabilities.
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor; invalid/expired returns 400.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      operationId: createUser
      tags:
      - Users
      summary: 'Admin: create local user'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Principal, action, target and immutable input bound; conflicting reuse returns 409.
      - name: X-CSRF-Token
        in: header
        schema:
          type: string
        description: Required for cookie-authenticated state-changing requests; not required for Bearer.
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Location:
              description: Resource URL.
              schema:
                type: string
        '400':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /users/{user_id}:
    get:
      operationId: getUser
      tags:
      - Users
      summary: 'Admin: read user'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            ETag:
              description: Strong validator.
              schema:
                type: string
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
    patch:
      operationId: updateUser
      tags:
      - Users
      summary: 'Admin: set Publish permission or Admin flag'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Strong ETag of the mutable resource; stale returns 412.
      - name: X-CSRF-Token
        in: header
        schema:
          type: string
        description: Required for cookie-authenticated state-changing requests; not required for Bearer.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            ETag:
              description: Strong validator.
              schema:
                type: string
        '400':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /users/{user_id}/token:
    delete:
      operationId: revokeUserToken
      tags:
      - Users
      summary: 'Admin: revoke a user personal token without revealing it'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        schema:
          type: string
        description: Required for cookie-authenticated state-changing requests; not required for Bearer.
      responses:
        '204':
          description: '204'
        '401':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 Problem Details. Hidden private resources use 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /settings:
    get:
      operationId: getSettings
      tags:
      - Settings
      summary: 'Admin: read server settings'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
