    InventoryEntry:
      type: object
      properties:
        type:
          type: string
          enum:
          - File
          - Directory
        path:
          type: string
        fileId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        size:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 18446744073709551615
          - type: 'null'
        sha256:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
        executable:
          anyOf:
          - type: boolean
          - type: 'null'
      required:
      - type
      - path
      additionalProperties: false
      if:
        properties:
          type:
            const: File
        required:
        - type
      then:
        properties:
          fileId:
            type: string
            format: uuid
          size:
            type: integer
            minimum: 0
            maximum: 18446744073709551615
          sha256:
            type: string
            pattern: ^[0-9a-f]{64}$
          executable:
            type: boolean
        required:
        - fileId
        - size
        - sha256
        - executable
      else:
        properties:
          fileId:
            type: 'null'
          size:
            type: 'null'
          sha256:
            type: 'null'
          executable:
            type: 'null'
