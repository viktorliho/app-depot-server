          - type: string
            format: uuid
          - type: 'null'
        size:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 18446744073709551615
          - type: 'null'
        sha256:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
        executable:
          anyOf:
          - type: boolean
          - type: 'null'
        transferRequired:
          type: boolean
          default: true
          description: False only after authorization-scoped verified-object reuse; omission means true.
      required:
      - path
      - type
      additionalProperties: false
