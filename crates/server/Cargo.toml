[package]
name = "app-depot-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
app-depot-application = { path = "../application" }
app-depot-domain = { path = "../domain" }
app-depot-infrastructure = { path = "../infrastructure" }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid = { version = "=1.16.0", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
fs2 = "0.4"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
