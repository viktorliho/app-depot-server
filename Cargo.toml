[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/server"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
